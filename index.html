<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kinoprogramm Nürnberg</title>
  <meta name="description" content="Welche Filme laufen wann in den Kinos in Nürnberg, Fürth und Erlangen.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="kopf">
    <div class="wrap">
      <div class="kopf-knoepfe">
        <label class="region-wahl"><span>Region</span>
          <select id="region-wahl">
            <option value="nuernberg">Nürnberg · Fürth · Erlangen</option>
            <option value="hamburg">Hamburg</option>
          </select>
        </label>
        <button type="button" class="profil-knopf" id="profil-knopf" aria-haspopup="dialog">Mein Kino</button>
      </div>
      <div class="augenbraue" id="augenbraue">Nürnberg <i></i> Fürth <i></i> Erlangen</div>
      <h1>Kinoprogramm</h1>
      <div class="kennzahlen" id="kennzahlen"></div>
    </div>
    <div class="teppich"></div>
  </header>

  <div class="reiter-band">
    <nav class="reiter wrap" role="tablist" aria-label="Ansichten">
      <button role="tab" data-ansicht="highlights" aria-selected="true">Highlights</button>
      <button role="tab" data-ansicht="programm" aria-selected="false">Programm</button>
      <button role="tab" data-ansicht="chance" aria-selected="false">Letzte Chance</button>
      <button role="tab" data-ansicht="festivals" aria-selected="false">Festivals</button>
      <!-- Reiter Kalender ausgeblendet, der Code der Ansicht bleibt in app.js
      <button role="tab" data-ansicht="kalender" aria-selected="false">Kalender</button>
      -->
      <button role="tab" data-ansicht="filme" aria-selected="false">Filme</button>
      <button role="tab" data-ansicht="regie" aria-selected="false">Regie</button>
      <button role="tab" data-ansicht="kinos" aria-selected="false">Kinos</button>
      <button role="tab" data-ansicht="statistik" aria-selected="false">Statistik</button>
      <button role="tab" data-ansicht="baukasten" aria-selected="false">Datenexploration</button>
    </nav>
  </div>

  <section class="filter wrap" aria-label="Filter" id="filter">
    <label><span id="f-stadt-name">Stadt</span>
      <!-- Orte der Region füllt app.js -->
      <select id="f-stadt"><option value="">Alle Städte</option></select>
    </label>
    <label>Kino
      <select id="f-kino"><option value="">Alle Kinos</option></select>
    </label>
    <label>Land
      <select id="f-land"><option value="">Alle Länder</option></select>
    </label>
    <label>Jahrzehnt
      <select id="f-jahrzehnt"><option value="">Alle Jahrzehnte</option></select>
    </label>
    <label class="suche">Suche
      <input id="f-suche" type="search" placeholder="Titel oder Regie">
    </label>
    <button class="zuruecksetzen" id="f-reset" hidden>Filter zurücksetzen</button>
  </section>

  <main class="wrap">
    <section id="v-highlights" class="ansicht"></section>
    <section id="v-programm" class="ansicht" hidden></section>
    <section id="v-chance" class="ansicht" hidden></section>
    <section id="v-festivals" class="ansicht" hidden></section>
    <section id="v-kalender" class="ansicht" hidden></section>
    <section id="v-filme" class="ansicht" hidden></section>
    <section id="v-regie" class="ansicht" hidden></section>
    <section id="v-statistik" class="ansicht" hidden></section>
    <section id="v-baukasten" class="ansicht" hidden></section>
    <section id="v-kinos" class="ansicht" hidden></section>
    <section id="v-impressum" class="ansicht" hidden></section>
  </main>

  <footer class="wrap fuss" id="fuss"></footer>

  <dialog id="film-dialog" aria-labelledby="fd-titel">
    <form method="dialog"><button class="schliessen" aria-label="Schließen">×</button></form>
    <div id="fd-inhalt"></div>
  </dialog>

  <dialog id="profil-dialog" aria-labelledby="pd-titel">
    <form method="dialog"><button class="schliessen" aria-label="Schließen">×</button></form>
    <div id="pd-inhalt"></div>
  </dialog>

  <!-- Weltkarte in der Statistik: d3-geo mit Länderumrissen aus world-atlas, lokal abgelegt (keine Abrufe bei Dritten) -->
  <script src="vendor/d3-array.min.js"></script>
  <script src="vendor/d3-geo.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <!-- Region wählen: ?region=… in der Adresse, sonst die zuletzt gewählte, sonst Nürnberg. Je Region eine eigene Datendatei. -->
  <script>
    (function () {
      var DATEIEN = { nuernberg: 'data.js', hamburg: 'data-hamburg.js' };
      var r = null;
      try { r = new URLSearchParams(location.search).get('region'); } catch (e) { /* alte Browser */ }
      if (!DATEIEN[r]) { try { r = localStorage.getItem('kinoRegion'); } catch (e) { r = null; } }
      if (!DATEIEN[r]) r = 'nuernberg';
      try { localStorage.setItem('kinoRegion', r); } catch (e) { /* ohne Speicher */ }
      window.KINO_REGIONEN = DATEIEN;
      document.write('<script src="' + DATEIEN[r] + '"><\/script>');
    })();
  </script>
  <script src="app.js"></script>
</body>
</html>
