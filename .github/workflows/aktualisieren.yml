# Aktualisiert das Kinoprogramm jeden Morgen und veroeffentlicht die Website auf GitHub Pages.
# Manuell starten: im Repository unter "Actions" > "Kinoprogramm aktualisieren" > "Run workflow".
# Bei jedem Hochladen von Aenderungen (push) wird die Website ohne neuen Abruf veroeffentlicht.
# Jeder geplante Lauf liest das ganze Programm und die Auslastung. Ein Handstart mit Haken liest nur die Auslastung.

name: Kinoprogramm aktualisieren

on:
  schedule:
    # Taeglich 06:00 UTC = 7 Uhr Winterzeit, 8 Uhr Sommerzeit. GitHub startet geplante Laeufe oft etwas spaeter.
    - cron: '0 6 * * *'
    # Dienstag 17:00 UTC = 18 Uhr Winterzeit: die Cinecitta-Gruppe stellt die neue Woche meist dienstags online
    - cron: '0 17 * * 2'
    # Donnerstag 14:00 UTC = 15 Uhr Winterzeit: Casablanca und Lamm-Lichtspiele veroeffentlichen ihre Woche erst donnerstags
    - cron: '0 14 * * 4'
  workflow_dispatch:
    inputs:
      nur_auslastung:
        description: 'Nur die Auslastung lesen (ohne Programmabruf)'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kinoprogramm
  cancel-in-progress: false

jobs:
  aktualisieren:
    # Fest auf Ubuntu 24.04, weil ubuntu-latest waehrend der Umstellung auf Ubuntu 26.04 keine Runner bekam (11.11.2026)
    runs-on: ubuntu-24.04
    env:
      # Nur beim Handstart mit Haken: nur Auslastung, kein Programmabruf
      NUR_AUSLASTUNG: ${{ inputs.nur_auslastung == true }}
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichen.outputs.page_url || steps.veroeffentlichen2.outputs.page_url }}
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: pdftotext fuer die Casablanca-Flyer installieren
        if: github.event_name != 'push' && env.NUR_AUSLASTUNG != 'true'
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      - name: Kinoseiten auslesen und Daten abgleichen
        if: github.event_name != 'push' && env.NUR_AUSLASTUNG != 'true'
        shell: pwsh
        env:
          # Per Link freigegebener Google-Drive-Ordner mit gespeicherten Cineplex-Seiten (vom iPhone)
          CINEPLEX_DRIVE_ORDNER: ${{ secrets.CINEPLEX_DRIVE_ORDNER }}
        run: ./tools/aktualisieren.ps1

      - name: Cineplex Fuerth aus dem Drive-Ordner ergaenzen (taeglich)
        if: github.event_name != 'push' && env.NUR_AUSLASTUNG == 'true'
        # Sondervorstellungen und Vorverkauf aus der zuletzt hochgeladenen Seite, auch zwischen den Programmlaeufen
        continue-on-error: true
        shell: pwsh
        env:
          CINEPLEX_DRIVE_ORDNER: ${{ secrets.CINEPLEX_DRIVE_ORDNER }}
        run: ./tools/aktualisieren.ps1 -Ausleser Get-CineplexAusEingang

      - name: Kinoseiten in Hamburg auslesen
        if: github.event_name != 'push' && env.NUR_AUSLASTUNG != 'true'
        # Faellt Hamburg aus, laeuft Nuernberg trotzdem weiter
        continue-on-error: true
        shell: pwsh
        run: ./tools/aktualisieren.ps1 -Region hamburg

      - name: Plakate, Filmangaben und Wertungen ergaenzen, Score berechnen
        if: github.event_name != 'push' && env.NUR_AUSLASTUNG != 'true'
        shell: pwsh
        env:
          # Im Repository unter Settings > Secrets and variables > Actions hinterlegen
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBL_API_KEY }}
        run: |
          ./tools/tmdb.ps1
          ./tools/personen.ps1
          ./tools/mdblist.ps1
          ./tools/preise.ps1
          ./tools/build-data.ps1
          ./tools/build-data.ps1 -Region hamburg

      - name: Auslastung der Cinecitta-Vorstellungen lesen
        if: github.event_name != 'push'
        # Faellt die Auslastung aus, laeuft der Rest trotzdem weiter
        continue-on-error: true
        shell: pwsh
        run: |
          ./tools/auslastung.ps1
          ./tools/build-data.ps1

      - name: Neue Daten speichern
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js daten/programm.json daten/letzter-lauf.json daten/auslastung.json daten/festivals-erkannt.json
          git add data-hamburg.js daten/hamburg 2>/dev/null || true
          git add daten/filminfos.json daten/wertungen.json daten/preise.json daten/preise-geprueft.json plakate 2>/dev/null || true
          git add daten/personen.json fotos 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine Aenderungen im Programm."
          else
            git commit -m "${{ env.NUR_AUSLASTUNG == 'true' && 'Auslastung aktualisiert' || 'Kinoprogramm aktualisiert' }} $(TZ=Europe/Berlin date +%Y-%m-%d)"
            git push
          fi

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Website bündeln
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # GitHub findet das gerade hochgeladene Paket manchmal erst nach einigen Sekunden
      # ("No artifacts named github-pages"). Dann nach einer Pause ein zweiter Versuch.
      - name: Website veröffentlichen
        id: veroeffentlichen
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Kurz warten vor dem zweiten Versuch
        if: steps.veroeffentlichen.outcome == 'failure'
        run: sleep 45

      - name: Website veröffentlichen (zweiter Versuch)
        id: veroeffentlichen2
        if: steps.veroeffentlichen.outcome == 'failure'
        uses: actions/deploy-pages@v4
