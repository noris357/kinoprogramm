# Aktualisiert das Kinoprogramm jeden Mittwochvormittag und veroeffentlicht die Website auf GitHub Pages.
# Manuell starten: im Repository unter "Actions" > "Kinoprogramm aktualisieren" > "Run workflow".
# Bei jedem Hochladen von Aenderungen (push) wird die Website ohne neuen Abruf veroeffentlicht.
# Zusaetzlich liest ein taeglicher Lauf nur die Auslastung der Cinecitta-Vorstellungen (tools/auslastung.ps1).

name: Kinoprogramm aktualisieren

on:
  schedule:
    # Mittwoch 09:00 UTC = 10:00 Uhr Winterzeit, 11:00 Uhr Sommerzeit. GitHub startet geplante Laeufe oft etwas spaeter.
    - cron: '0 9 * * 3'
    # Taeglich 06:00 UTC = 7 Uhr Winterzeit, 8 Uhr Sommerzeit: nur Auslastung
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      nur_auslastung:
        description: 'Nur die Auslastung lesen (ohne Programmabruf)'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kinoprogramm
  cancel-in-progress: false

jobs:
  aktualisieren:
    # Fest auf Ubuntu 24.04, weil ubuntu-latest waehrend der Umstellung auf Ubuntu 26.04 keine Runner bekam (11.11.2026)
    runs-on: ubuntu-24.04
    env:
      # Taeglicher Lauf oder Handstart mit Haken: nur Auslastung, kein Programmabruf
      NUR_AUSLASTUNG: ${{ github.event.schedule == '0 6 * * *' || inputs.nur_auslastung == true }}
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichen.outputs.page_url }}
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: pdftotext fuer die Casablanca-Flyer installieren
        if: github.event_name != 'push' && env.NUR_AUSLASTUNG != 'true'
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      - name: Kinoseiten auslesen und Daten abgleichen
        if: github.event_name != 'push' && env.NUR_AUSLASTUNG != 'true'
        shell: pwsh
        run: ./tools/aktualisieren.ps1

      - name: Plakate, Filmangaben und Wertungen ergaenzen, Score berechnen
        if: github.event_name != 'push' && env.NUR_AUSLASTUNG != 'true'
        shell: pwsh
        env:
          # Im Repository unter Settings > Secrets and variables > Actions hinterlegen
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBL_API_KEY }}
        run: |
          ./tools/tmdb.ps1
          ./tools/personen.ps1
          ./tools/mdblist.ps1
          ./tools/preise.ps1
          ./tools/build-data.ps1

      - name: Auslastung der Cinecitta-Vorstellungen lesen
        if: github.event_name != 'push'
        # Faellt die Auslastung aus, laeuft der Rest trotzdem weiter
        continue-on-error: true
        shell: pwsh
        run: |
          ./tools/auslastung.ps1
          ./tools/build-data.ps1

      - name: Neue Daten speichern
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js daten/programm.json daten/letzter-lauf.json daten/auslastung.json
          git add daten/filminfos.json daten/wertungen.json daten/preise.json daten/preise-geprueft.json plakate 2>/dev/null || true
          git add daten/personen.json fotos 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine Aenderungen im Programm."
          else
            git commit -m "${{ env.NUR_AUSLASTUNG == 'true' && 'Auslastung aktualisiert' || 'Kinoprogramm aktualisiert' }} $(TZ=Europe/Berlin date +%Y-%m-%d)"
            git push
          fi

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Website bündeln
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Website veröffentlichen
        id: veroeffentlichen
        uses: actions/deploy-pages@v4
